services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: prissma
      POSTGRES_USER: prissma
      POSTGRES_PASSWORD: prissma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - prissma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prissma -d prissma"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    # O container nao enxerga o .env da raiz sozinho. Sem isto a OPENAI_API_KEY
    # chega vazia e so a geracao de imagens falha — o app sobe normalmente, o
    # que torna o problema silencioso ate alguem clicar em "Previa visual IA".
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/prissma
      SPRING_DATASOURCE_USERNAME: prissma
      SPRING_DATASOURCE_PASSWORD: prissma
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      # Vazio por padrao. SPRING_PROFILES_ACTIVE=seed popula dados de demonstracao.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_MAIL_USERNAME: prissma.noreply2@gmail.com
      SPRING_MAIL_PASSWORD: tcyl bnki tovb nsex

    depends_on:
      db:
        condition: service_healthy
    networks:
      - prissma-network

volumes:
  pgdata:
    driver: local

networks:
  prissma-network:
    driver: bridge
