services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: prissma
      POSTGRES_USER: prissma
      POSTGRES_PASSWORD: prissma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - prissma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prissma -d prissma"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    # O container nao enxerga o .env da raiz sozinho. O env_file injeta as
    # demais variaveis locais sem versionar credenciais no docker-compose.
    env_file:
      - .env
    environment:
      # Uma unica URL carrega host, banco, usuario e senha.
      # Em Cloud Run, defina DATABASE_URL com a string entregue pelo Neon.
      DATABASE_URL: postgresql://prissma:prissma@db:5432/prissma
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

    depends_on:
      db:
        condition: service_healthy
    networks:
      - prissma-network

volumes:
  pgdata:
    driver: local

networks:
  prissma-network:
    driver: bridge
