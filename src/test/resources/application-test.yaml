security:
  jwt:
    secret: test-secret-key
    expiration: 86400000
  password-reset:
    frontend-url: http://localhost:3000

spring:
  # Datasource vem do EmbeddedPostgresConfig: um PostgreSQL 17 real por suite,
  # um Postgres 17 real por suíte, com as migrations Flyway reais — o H2 foi
  # removido porque nunca conseguiu rodá-las (V2 falha em TIMESTAMPTZ).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 3025

springdoc:
  swagger-ui:
    path: /

