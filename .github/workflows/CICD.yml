name: Build and deploy JAR app to Azure Web App - testjavawebapp
on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  GCP_PROJECT_ID: prissma
  GCP_REGION: us-south1
  CLOUD_RUN_SERVICE: prissma-server

jobs:
  CI:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
      - name: Build with Maven Wrapper
        run: ./mvnw -B clean package
      - name: Locate executable jar
        id: locate-jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name '*.jar' ! -name '*.jar.original' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No runnable jar found in target/"
            exit 1
          fi
          echo "Found jar: $JAR_PATH"
          # O App Service (Java SE) espera o artefato como app.jar em
          # /home/site/wwwroot. Publicar com o nome versionado obriga a repetir a
          # versao no Startup Command do portal, e qualquer bump de versao no pom
          # quebra o boot com "Unable to access jarfile".
          cp "$JAR_PATH" app.jar
          ls -la app.jar
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: app.jar
  CD:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'testjavawebapp'
          slot-name: 'Production'
          package: 'app.jar'
          publish-profile: ${{ secrets.publish_profile }}
